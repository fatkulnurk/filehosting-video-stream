name: CI

on:
    push:
        branches: [dev]
    pull_request:
        branches: [dev]

permissions:
    contents: read

jobs:
    php:
        name: PHP 8.5 — Pint & Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: mbstring, dom, pdo_sqlite, fileinfo, zip
                  coverage: none

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Create SQLite database
              run: touch database/database.sqlite

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Create minimal Vite manifest for tests
              run: |
                  mkdir -p public/build/assets
                  printf '%s' '{"resources/js/app.js":{"file":"assets/app.js","isEntry":true,"src":"resources/js/app.js"},"resources/css/app.css":{"file":"assets/app.css"}}' > public/build/manifest.json

            - name: Run Laravel Pint
              run: vendor/bin/pint --test

            - name: Run tests
              run: php artisan test --compact
              env:
                  APP_ENV: testing
                  DB_CONNECTION: sqlite
                  DB_DATABASE: ':memory:'
                  CONCURRENCY_DRIVER: sync

    frontend:
        name: Frontend — Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build assets
              run: npm run build
